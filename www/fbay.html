<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Sign Up - Fbay</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>
if ('serviceWorker' in navigator) {

    window.addEventListener('load', () => {

        navigator.serviceWorker.register('sw.js')
            .then(registration => {
                console.log("Fbay Service Worker Registered:", registration.scope);
            })
            .catch(error => {
                console.error("Fbay Service Worker Error:", error);
            });

    });

}
</script>

    <link rel="icon" type="image/png" href="download.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen px-4">

<div class="w-full max-w-md bg-gray-800 border border-gray-700/60 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
    
    <!-- Dynamic Status Container -->
    <div id="systemStatusContainer">
        <!-- Loading state initially -->
        <div class="text-center py-10 text-gray-400">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
            <p class="text-xs">Checking system availability...</p>
        </div>
    </div>

    <!-- Main Forms Wrapper (Hidden by default until status check passes) -->
    <div id="formsWrapper" class="hidden">
        <!-- Toggle Tabs -->
        <div class="flex bg-gray-900/60 p-1 rounded-2xl mb-6">
            <button id="tabSigninBtn" onclick="switchTab('signin')" class="flex-1 py-2.5 rounded-xl text-sm font-semibold transition bg-blue-600 text-white shadow">Sign In</button>
            <button id="tabSignupBtn" onclick="switchTab('signup')" class="flex-1 py-2.5 rounded-xl text-sm font-semibold transition text-gray-400 hover:text-white">Sign Up</button>
        </div>

        <!-- Alert Box (Placed right above forms) -->
        <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold"></div>

        <!-- ================= SIGN IN FORM ================= -->
        <form id="signinForm" onsubmit="handleSignin(event)" class="space-y-4">
            <!-- Sign In Step 1: Credentials -->
            <div id="signinStep1" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Email Address</label>
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-gray-500"></i>
                        <input type="email" id="signinEmail" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 pl-11 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="name@example.com">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-gray-500"></i>
                        <input type="password" id="signinPassword" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 pl-11 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
                    </div>
                </div>
                <button type="button" onclick="sendLoginOtp()" id="sendLoginOtpBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 transition text-white py-3 rounded-xl font-semibold shadow-lg shadow-blue-600/30">Login</button>
            </div>

            <!-- Sign In Step 2: OTP Verification -->
            <div id="signinStep2" class="hidden space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Enter 6-Digit OTP sent to Email</label>
                    <input type="text" id="signinOtp" maxlength="6" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-center tracking-widest text-lg text-white focus:outline-none focus:border-blue-500 transition" placeholder="123456">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition text-white py-3 rounded-xl font-semibold shadow-lg shadow-emerald-600/30">Verify & Sign In</button>
                <button type="button" onclick="resetSigninStep()" class="w-full text-xs text-gray-400 hover:text-white mt-2">← Back to Credentials</button>
            </div>
        </form>

        <!-- ================= SIGN UP FORM ================= -->
        <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4 hidden">
            <div id="signupStep1">
                <div class="space-y-3">
                    <!-- Sponsor Code (Mandatory & Uppercase Input Only) -->
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Sponsor Code <span class="text-red-500">*</span></label>
                        <input type="text" id="sponsorCode" required oninput="this.value = this.value.toUpperCase(); checkSponsor()" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="Enter sponsor code">
                        <p id="sponsorMsg" class="text-xs mt-1 hidden"></p>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Full Name</label>
                        <input type="text" id="signupName" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Email Address</label>
                        <input type="email" id="signupEmail" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="name@example.com">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                        <input type="password" id="signupPassword" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
                    </div>
                </div>
                <button type="button" onclick="sendOtp()" id="sendOtpBtn" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 active:scale-95 transition text-white py-3 rounded-xl font-semibold shadow-lg shadow-blue-600/30">Register</button>
            </div>

            <!-- Step 2: OTP Verification & Finalize -->
            <div id="signupStep2" class="hidden space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Enter 6-Digit OTP sent to Email</label>
                    <input type="text" id="signupOtp" maxlength="6" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-center tracking-widest text-lg text-white focus:outline-none focus:border-blue-500 transition" placeholder="123456">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition text-white py-3 rounded-xl font-semibold shadow-lg shadow-emerald-600/30">Verify & Complete Signup</button>
                <button type="button" onclick="resetSignupStep()" class="w-full text-xs text-gray-400 hover:text-white mt-2">← Back to Details</button>
            </div>
        </form>
    </div>
</div>

    <!-- JavaScript Logic -->
    <script>
        let isSponsorValid = false;

        // Auto-check URL parameter on page load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codeParam = urlParams.get('code');
            if (codeParam) {
                const sponsorInput = document.getElementById('sponsorCode');
                sponsorInput.value = codeParam.toUpperCase();
                switchTab('signup'); // Switch to sign up automatically if referral code exists
                checkSponsor(); // Validate it right away
            }
        });

        function switchTab(tab) {
            const signinBtn = document.getElementById('tabSigninBtn');
            const signupBtn = document.getElementById('tabSignupBtn');
            const signinForm = document.getElementById('signinForm');
            const signupForm = document.getElementById('signupForm');
            hideAlert();

            if (tab === 'signin') {
                signinBtn.className = "flex-1 py-2.5 rounded-xl text-sm font-semibold transition bg-blue-600 text-white shadow";
                signupBtn.className = "flex-1 py-2.5 rounded-xl text-sm font-semibold transition text-gray-400 hover:text-white";
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                signupBtn.className = "flex-1 py-2.5 rounded-xl text-sm font-semibold transition bg-blue-600 text-white shadow";
                signinBtn.className = "flex-1 py-2.5 rounded-xl text-sm font-semibold transition text-gray-400 hover:text-white";
                signupForm.classList.remove('hidden');
                signinForm.classList.add('hidden');
            }
        }

        function showAlert(message, success = true) {
            const box = document.getElementById('alertBox');
            box.className = `mb-4 p-3 rounded-xl text-xs font-semibold ${success ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}`;
            box.innerText = message;
            box.classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.add('hidden');
        }

        // Live Sponsor Validation
        let sponsorTimeout = null;
        async function checkSponsor() {
            const code = document.getElementById('sponsorCode').value.trim();
            const msgBox = document.getElementById('sponsorMsg');

            if (!code) {
                msgBox.classList.add('hidden');
                isSponsorValid = false;
                return;
            }

            clearTimeout(sponsorTimeout);
            sponsorTimeout = setTimeout(async () => {
                try {
                    const response = await fetch('auth.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'check_sponsor', sponsor: code })
                    });
                    const result = await response.json();

                    msgBox.classList.remove('hidden');
                    if (result.success) {
                        msgBox.className = "text-xs mt-1 text-emerald-400 font-medium";
                        msgBox.innerText = `✓ Sponsor Found: ${result.sponsor_name}`;
                        isSponsorValid = true;
                    } else {
                        msgBox.className = "text-xs mt-1 text-red-400 font-medium";
                        msgBox.innerText = "✕ Invalid sponsor code or email.";
                        isSponsorValid = false;
                    }
                } catch (err) {
                    console.error(err);
                }
            }, 400);
        }

        // Send Signup OTP
        async function sendOtp() {
            const sponsor = document.getElementById('sponsorCode').value.trim();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;

            if (!sponsor || !isSponsorValid) {
                showAlert("Valid sponsor code is mandatory!", false);
                return;
            }

            if (!name || !email || !password) {
                showAlert("Please fill in all required fields.", false);
                return;
            }

            if (password.length < 6) {
                showAlert("Password must be at least 6 characters long.", false);
                return;
            }

            const btn = document.getElementById('sendOtpBtn');
            btn.innerText = "Sending OTP...";
            btn.disabled = true;

            try {
                const response = await fetch('auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'send_otp', email: email })
                });
                const result = await response.json();
                
                if (result.success) {
                    showAlert(result.message, true);
                    document.getElementById('signupStep1').classList.add('hidden');
                    document.getElementById('signupStep2').classList.remove('hidden');
                } else {
                    showAlert(result.message, false);
                }
            } catch (error) {
                showAlert("An error occurred. Check your network.", false);
            } finally {
                btn.innerText = "Send Verification OTP";
                btn.disabled = false;
            }
        }

        function resetSignupStep() {
            document.getElementById('signupStep2').classList.add('hidden');
            document.getElementById('signupStep1').classList.remove('hidden');
            hideAlert();
        }

        // Send Sign In OTP
        async function sendLoginOtp() {
            const email = document.getElementById('signinEmail').value.trim();
            const password = document.getElementById('signinPassword').value;

            if (!email || !password) {
                showAlert("Please enter email and password.", false);
                return;
            }

            const btn = document.getElementById('sendLoginOtpBtn');
            btn.innerText = "Sending OTP...";
            btn.disabled = true;

            try {
                const response = await fetch('auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'send_login_otp', email, password })
                });
                const result = await response.json();

                if (result.success) {
                    showAlert(result.message, true);
                    document.getElementById('signinStep1').classList.add('hidden');
                    document.getElementById('signinStep2').classList.remove('hidden');
                } else {
                    showAlert(result.message, false);
                }
            } catch (error) {
                showAlert("An error occurred during sign in verification.", false);
            } finally {
                btn.innerText = "Send Sign In OTP";
                btn.disabled = false;
            }
        }

        function resetSigninStep() {
            document.getElementById('signinStep2').classList.add('hidden');
            document.getElementById('signinStep1').classList.remove('hidden');
            hideAlert();
        }

        // Handle Signup Verification & Completion
        async function handleSignup(event) {
            event.preventDefault();
            const sponsorCode = document.getElementById('sponsorCode').value.trim();
            const fullName = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const otp = document.getElementById('signupOtp').value.trim();

            if (!sponsorCode || !isSponsorValid) {
                showAlert("Valid sponsor code is mandatory for registration.", false);
                return;
            }

            try {
                const response = await fetch('auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'signup', fullName, email, password, sponsorCode, otp })
                });
                const result = await response.json();

                if (result.success) {
                    showAlert(result.message, true);
                    setTimeout(() => switchTab('signin'), 2500);
                } else {
                    showAlert(result.message, false);
                }
            } catch (error) {
                showAlert("An error occurred during registration.", false);
            }
        }

        // Handle Sign In with OTP Verification
        async function handleSignin(event) {
            event.preventDefault();
            const email = document.getElementById('signinEmail').value.trim();
            const password = document.getElementById('signinPassword').value;
            const otp = document.getElementById('signinOtp').value.trim();

            try {
                const response = await fetch('auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'signin', email, password, otp })
                });
                const result = await response.json();

                if (result.success) {
                    showAlert(`Welcome back, ${result.user}! Redirecting...`, true);
                    setTimeout(() => {
                        window.location.href = "dashboard.php";
                    }, 1200);
                } else {
                    showAlert(result.message, false);
                }
            } catch (error) {
                showAlert("An error occurred during sign in.", false);
            }
        }
    // Check system operational status on page load
window.addEventListener('DOMContentLoaded', async () => {
    try {
        const response = await fetch('check-status.php'); // Your backend status script
        const result = await response.json();

        const statusContainer = document.getElementById('systemStatusContainer');
        const formsWrapper = document.getElementById('formsWrapper');

        if (result.success) {
            // System is open: hide status loader and show forms
            statusContainer.classList.add('hidden');
            formsWrapper.classList.remove('hidden');

            // Existing URL query param logic for referral code
            const urlParams = new URLSearchParams(window.location.search);
            const codeParam = urlParams.get('code');
            if (codeParam) {
                const sponsorInput = document.getElementById('sponsorCode');
                sponsorInput.value = codeParam.toUpperCase();
                switchTab('signup'); 
                checkSponsor(); 
            }
        } else {
            // System is closed: show animated message/emoji and article
            statusContainer.innerHTML = `
                <div class="text-center py-8 px-4 space-y-4">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-500/10 text-red-500 text-3xl animate-bounce">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <div class="space-y-1">
                        <h2 class="text-lg font-bold text-white">Portal Temporarily Closed</h2>
                        <p class="text-xs text-gray-400 leading-relaxed">
                            ${result.message || 'Sign in and Sign up services are only available between 09:00 AM and 11:00 PM (IST).'}
                        </p>
                    </div>
                    <div class="p-3 bg-gray-900/60 border border-gray-700/50 rounded-2xl text-left text-xs text-gray-400 space-y-1">
                        <p class="font-semibold text-gray-300"><i class="fa-solid fa-circle-info text-blue-500 mr-1"></i> Operating Hours:</p>
                        <p>🕒 Open daily from 09:00 AM to 11:00 PM.</p>
                        <p>💡 Please visit back during operational hours to access your account or register.</p>
                    </div>
                </div>
            `;
            statusContainer.classList.remove('hidden');
            formsWrapper.classList.add('hidden');
        }
    } catch (err) {
        console.error("Failed to check system status:", err);
        // Fallback safety if the endpoint fails
        document.getElementById('systemStatusContainer').classList.add('hidden');
        document.getElementById('formsWrapper').classList.remove('hidden');
    }
});
    </script>
</body>
</html>
